<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mbw-bot-zh</title>
<style>
:root{--bg:#f6f5f8;--panel:#fff;--ink:#1f1d2b;--muted:#6f6c7f;--line:#e6e4ee;--accent:#6c4fd8;--accent-ink:#fff;--mark:#ffe66d;--hover:#f0edfa}
@media(prefers-color-scheme:dark){:root{--bg:#15141b;--panel:#1e1d26;--ink:#ecebf2;--muted:#9995ab;--line:#2c2a37;--accent:#9d86ff;--accent-ink:#15141b;--mark:#8a7a1f;--hover:#262431}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;gap:.9em;padding:1.2em 1em;max-width:1100px;margin-inline:auto}
h1{font-size:1.1em;font-weight:600;margin:0;letter-spacing:.02em;display:flex;align-items:baseline;gap:.6em}
h1 span{color:var(--muted);font-weight:400;font-size:.85em}
input[type=text]{width:100%;font:inherit;font-size:1.15em;padding:.6em .9em;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);outline:none}
input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.eps{display:flex;flex-wrap:wrap;gap:.35em;margin:0;align-items:center}
.eps select{font:inherit;font-size:.85em;padding:.25em .6em;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);cursor:pointer}
.eps label{font-size:.85em;color:var(--muted);display:flex;align-items:center;gap:.35em;cursor:pointer}
.eps label input{accent-color:var(--accent)}
.player{width:100%;max-width:min(960px,calc(40vh * 16 / 9));margin-inline:auto;aspect-ratio:16/9;background:#000;flex:none;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.player iframe{width:100%;height:100%;border:0;display:block}
#n{margin:0;font-size:.85em;color:var(--muted)}
#r{flex:1;overflow:auto;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:14px}
#r:empty{display:none}
.hit{padding:.7em 1em;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.hit:last-child{border-bottom:0}
.hit:hover{background:var(--hover)}
.hit.on{background:color-mix(in srgb,var(--accent) 12%,var(--panel));box-shadow:inset 3px 0 0 var(--accent)}
.hit small{color:var(--muted);display:flex;gap:.9em;align-items:center;font-size:.8em;margin-bottom:.15em}
.hit small b{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.hit a{color:var(--muted);text-decoration:none}
.hit a:hover{color:var(--accent);text-decoration:underline}
.hit button{font:inherit;font-size:.8em;padding:0 .6em;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);cursor:pointer}
.hit button:hover{border-color:var(--accent);color:var(--accent)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 .1em}
</style>
<h1>mbw-bot-zh <span>《前橋魔女》台詞搜尋</span></h1>
<input type="text" id="q" placeholder="關鍵字或 regex，Enter 搜尋" autofocus>
<p class="eps" id="eps"></p>
<div class="player"><div id="p"></div></div>
<p id="n"></p>
<div id="r"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const MAX = 500;  // ponytail: cap the list; nobody scrolls 6000 rows
let cues = [], player, target = null, ep = 0;  // ep 0 = all episodes
const ts = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');
const esc = t => t.replace(/[&<>]/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[ch]));
const link = (vid, sec) => `https://youtu.be/${vid}?t=${Math.floor(sec)}`;
const setHash = sec => { location.hash = `q=${encodeURIComponent(q.value)}&ep=${ep}` + (fz.checked ? '&f=1' : '') + (sec != null ? `&t=${sec}` : ''); };

// episode filter: native <select> stays one line tall, unlike 13 wrapping pills
eps.innerHTML = '<select id="es">' + ['全部集數', ...Array.from({length: 12}, (_, i) => 'ep' + (i + 1))]
  .map((l, i) => `<option value="${i}">${l}</option>`).join('') + '</select>';
const showEp = () => es.value = ep;
eps.insertAdjacentHTML('beforeend', '<label style="margin-left:auto"><input type="checkbox" id="fz"> 模糊（字之間可隔 2 字）</label>');
es.onchange = () => { ep = +es.value; search(); };
fz.onchange = () => search();
// fuzzy: every query char in order, up to 2 chars apart; regex metachars escaped, spaces dropped
const fuzzyRe = s => [...s.replace(/\s/g, '')].map(c => c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('.{0,2}?');

function search(sec) {  // sec: line to select after rendering (when restoring from the URL)
  let re; try { re = new RegExp(fz.checked ? fuzzyRe(q.value) : q.value, 'gi'); } catch { n.textContent = 'regex 錯誤'; return; }
  const hits = q.value ? cues.filter(c => (!ep || c[0] === ep) && c[3].search(re) >= 0) : [];
  n.textContent = hits.length + ' hits' + (hits.length > MAX ? `（只顯示前 ${MAX}）` : '');
  r.innerHTML = hits.slice(0, MAX).map(([e, vid, s, text]) =>
    `<div class="hit" data-v="${vid}" data-s="${s}">
      <small><b>ep${String(e).padStart(2, '0')} · ${ts(s)}</b>
      <a href="${link(vid, s)}" target="_blank" title="在 YouTube 開啟，可自行暫停截圖">YouTube ↗</a>
      <button title="複製連結">複製</button></small>${esc(text).replace(re, m => `<mark>${m}</mark>`)}</div>`).join('');
  setHash(sec);
  const h = sec != null && r.querySelector(`.hit[data-s="${sec}"]`);
  if (h) { select(h); h.scrollIntoView({block: 'center'}); }
}
q.onkeydown = e => { if (e.key === 'Enter') search(); };

function select(h) {
  document.querySelectorAll('.hit.on').forEach(x => x.classList.remove('on')); h.classList.add('on');
  target = +h.dataset.s;
  setHash(target);
  if (player) player.loadVideoById({ videoId: h.dataset.v, startSeconds: target });
}
r.onclick = e => {
  const h = e.target.closest('.hit'); if (!h) return;
  if (e.target.tagName === 'A') return;  // let the link open normally
  if (e.target.tagName === 'BUTTON') {
    navigator.clipboard.writeText(link(h.dataset.v, h.dataset.s))
      .then(() => { e.target.textContent = '已複製'; setTimeout(() => e.target.textContent = '複製', 1200); });
    return;
  }
  select(h);
};

function onYouTubeIframeAPIReady() {
  player = new YT.Player('p', { playerVars: { rel: 0 }, events: { onReady: restore, onStateChange: e => {
    // load -> plays -> pause on the first PLAYING and snap to the exact second, so the frame is on screen
    if (e.data === YT.PlayerState.PLAYING && target !== null) {
      player.unloadModule('captions'); player.unloadModule('cc');  // subs are burned in; CC would double them
      player.pauseVideo(); player.seekTo(target, true); target = null;
    }
  } } });
}
// restore search + selection from the URL once both cues and player are ready
function restore() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (!cues.length || !player || !h.has('q')) return;
  q.value = h.get('q'); ep = +h.get('ep') || 0; showEp(); fz.checked = h.has('f');
  search(h.has('t') ? +h.get('t') : null);
}
fetch('cues.json').then(r => r.json()).then(c => { cues = c; n.textContent = c.length + ' 句已載入'; restore(); });
</script>
</html>
